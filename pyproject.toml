[project]
name = "opus"
version = "0.1.0"
description = "In-play microstructure trading bot for Binance Futures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.20; sys_platform != 'win32'",
    "websockets>=13",
    "aiohttp>=3.10",
    "orjson>=3.10",
    "polars[rtcompat]>=1.34",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
ml = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "optuna>=3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.api", "backend.collector", "backend.exchanges", "backend.features", "backend.ml", "backend.safety", "backend.traders"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
